modules:
  bitbucket:repoCodeFileViewer:
    - key: onlyoffice-app-for-bitbucket-cloud-repository-code-file-viewer
      resource: main
      resolver:
        function: resolver
      title: ONLYOFFICE Viewer
  function:
    - key: resolver
      handler: index.handler
remotes:
  - key: onlyoffice-remote
    baseUrl: https://d5a2-101-44-32-127.ngrok-free.app
    operations:
      - compute
    auth:
      appSystemToken:
        enabled: true
      appUserToken:
        enabled: true
resources:
  - key: main
    path: static/file-viewer/build
permissions:
  scopes:
    - read:repository:bitbucket
    - read:user:bitbucket
    - read:app-system-token
    - read:app-user-token
  content:
    scripts:
      - 'unsafe-inline'
    styles:
      - 'unsafe-inline'
  external:
    frames:
      - address: https://d5a2-101-44-32-127.ngrok-free.app

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/855aea4e-e3c0-438f-82bc-d7ade1a9bae2
