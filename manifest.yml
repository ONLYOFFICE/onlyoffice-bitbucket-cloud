app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/${FORGE_APP_ID}

environment:
  variables:
    - FORGE_APP_ID
    - FORGE_REMOTE_APP_URL

translations:
  resources:
    - key: en-US
      path: locales/en-US.json
  fallback:
    default: en-US

modules:
  bitbucket:repoCodeFileViewer:
    - key: onlyoffice-viewer
      resource: custom-ui
      resolver:
        function: editor-page-resolver
      title: ONLYOFFICE Viewer
  function:
    - key: editor-page-resolver
      handler: index.editorPageResolver

remotes:
  - key: remote-service
    baseUrl: ${FORGE_REMOTE_APP_URL}
    operations:
      - compute
    auth:
      appSystemToken:
        enabled: true
      appUserToken:
        enabled: true

resources:
  - key: custom-ui
    path: static/onlyoffice-bitbucket-cloud-custom-ui/build

permissions:
  scopes:
    - read:repository:bitbucket
    - read:user:bitbucket
    - read:app-system-token
    - read:app-user-token
  content:
    scripts:
      - 'unsafe-inline'
    styles:
      - 'unsafe-inline'
  external:
    frames:
      - address: ${FORGE_REMOTE_APP_URL}/editor/bitbucket

