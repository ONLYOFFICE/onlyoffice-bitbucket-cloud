name: Licenses

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/licenses.yml"
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/licenses.yml"

permissions:
  contents: read

jobs:
  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static/onlyoffice-bitbucket-cloud-custom-ui/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: ./static/onlyoffice-bitbucket-cloud-custom-ui
      - name: Get project license
        id: license
        run: echo "license=$(node -p "require('./package.json').license")" >> "$GITHUB_OUTPUT"
      - uses: ONLYOFFICE/check-licenses@v1
        with:
          project_license: ${{ steps.license.outputs.license }}
      - uses: ONLYOFFICE/check-licenses@v1
        with:
          project_license: ${{ steps.license.outputs.license }}
          working_directory: ./static/onlyoffice-bitbucket-cloud-custom-ui
