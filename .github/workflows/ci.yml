name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
    paths-ignore:
      - "**/LICENSE"
      - "**/README.md"
      - ".github/workflows/create-tag.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/staging.yml"
      - ".github/workflows/licenses.yml"
  pull_request:
    paths-ignore:
      - "**/LICENSE"
      - "**/README.md"
      - ".github/workflows/create-tag.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/staging.yml"
      - ".github/workflows/licenses.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static/onlyoffice-bitbucket-cloud-custom-ui/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: ./static/onlyoffice-bitbucket-cloud-custom-ui
      - run: npm run typecheck
      - run: npm run typecheck
        working-directory: ./static/onlyoffice-bitbucket-cloud-custom-ui
      - run: npm run eslint
      - run: npm run build
        working-directory: ./static/onlyoffice-bitbucket-cloud-custom-ui
