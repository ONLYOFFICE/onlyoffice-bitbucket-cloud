name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Install Forge CLI
        run: npm install -g @forge/cli
      - name: Disable Forge usage analytics
        run: forge settings set usage-analytics false
      - name: Install dependencies in Forge Root Project
        run: npm ci
      - name: Install dependencies in Forge Custom UI Project
        run: npm ci
        working-directory: ./static/onlyoffice-bitbucket-cloud-custom-ui
      - name: Build Forge Custom UI Project
        run: npm run build
        working-directory: ./static/onlyoffice-bitbucket-cloud-custom-ui
      - name: Deploy Forge app
        run: forge deploy --environment production --non-interactive
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          FORGE_APP_ID: ${{ secrets.FORGE_APP_ID }}
          FORGE_REMOTE_APP_URL: ${{ secrets.FORGE_REMOTE_APP_URL }}
      - name: Extract release notes
        run: |
          awk -v head="## [${GITHUB_REF_NAME#v}]" '
            index($0, head) == 1 { p = 1; next }
            /^## / { p = 0 }
            p
          ' CHANGELOG.md > RELEASE.md
      - uses: ncipollo/release-action@v1
        with:
          bodyFile: RELEASE.md
          tag: ${{ github.ref_name }}
